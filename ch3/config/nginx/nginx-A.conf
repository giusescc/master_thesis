# P2 proxy config A: a caching reverse proxy that HONOURS ORIGIN HEADERS.
#
# Caching is switched on (proxy_cache), but nothing overrides what the origin
# says: no proxy_cache_valid, no proxy_ignore_headers. nginx then stores a
# response only if the origin makes it cacheable (Cache-Control / Expires /
# X-Accel-Expires), and it respects Vary. The cache key is nginx's default
# ($scheme$proxy_host$request_uri).
#
# This is a proxy configuration written for the experiment, not CSS behaviour.
#   :3180 -> CSS WAC (:3100)     :3181 -> CSS ACP (:3101)

worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    proxy_cache_path /var/cache/nginx/wac keys_zone=wac:10m inactive=10m;
    proxy_cache_path /var/cache/nginx/acp keys_zone=acp:10m inactive=10m;

    # Correction (2026-09-24, before any accepted P2 run): upstream keepalive.
    # Without it nginx opened a new TCP connection to CSS per request, and on
    # Docker Desktop for Mac some of those connections to host.docker.internal
    # stalled ~36 s (CSS logged the request's arrival 36 s after nginx sent it).
    # Keepalive reuses connections; it does not change what is cached.
    upstream css_wac { server host.docker.internal:3100; keepalive 8; }
    upstream css_acp { server host.docker.internal:3101; keepalive 8; }

    server {
        listen 3180;
        location / {
            proxy_pass http://css_wac;
            proxy_set_header Connection "";
            proxy_set_header Host localhost:3100;
            proxy_http_version 1.1;
            proxy_cache wac;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 3181;
        location / {
            proxy_pass http://css_acp;
            proxy_set_header Connection "";
            proxy_set_header Host localhost:3101;
            proxy_http_version 1.1;
            proxy_cache acp;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
