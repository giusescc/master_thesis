# P2 proxy config B: a DELIBERATELY PERMISSIVE CONFIGURATION.
#
# Built to show what a cache CAN do when told to ignore the origin. It is not
# presented as typical or common; we have no source for how often proxies are
# configured like this.
#
#   proxy_cache_valid 200 60s        store every 200 for 60 s, whatever the origin says
#   proxy_ignore_headers ... Vary    ignore Cache-Control/Expires and Vary, so the
#                                    cache key is the URL only: Authorization and
#                                    DPoP are NOT part of the key
#
# This is a proxy configuration written for the experiment, not CSS behaviour.
#   :3182 -> CSS WAC (:3100)     :3183 -> CSS ACP (:3101)

worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    proxy_cache_path /var/cache/nginx/wac keys_zone=wac:10m inactive=10m;
    proxy_cache_path /var/cache/nginx/acp keys_zone=acp:10m inactive=10m;

    server {
        listen 3182;
        location / {
            proxy_pass http://host.docker.internal:3100;
            proxy_set_header Host localhost:3100;
            proxy_http_version 1.1;
            proxy_cache wac;
            proxy_cache_key $scheme$proxy_host$request_uri;
            proxy_cache_valid 200 60s;
            proxy_ignore_headers Cache-Control Expires X-Accel-Expires Vary Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 3183;
        location / {
            proxy_pass http://host.docker.internal:3101;
            proxy_set_header Host localhost:3101;
            proxy_http_version 1.1;
            proxy_cache acp;
            proxy_cache_key $scheme$proxy_host$request_uri;
            proxy_cache_valid 200 60s;
            proxy_ignore_headers Cache-Control Expires X-Accel-Expires Vary Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
