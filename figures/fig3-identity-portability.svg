<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>An identity hosted by the provider you leave does not survive (experiment 03)</title>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="none"/>
  <text x="16" y="26" font-size="15" font-weight="700" fill="#0f172a">Experiment 03 — provider-hosted identity vs. independent identity</text>
  <text x="16" y="46" font-size="12" fill="#475569">Provider A is switched off. Both identities then try to read a resource on provider B that was explicitly granted to them.</text>

  <!-- Case A -->
  <rect x="20" y="66" width="345" height="140" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="34" y="88" font-size="12" font-weight="700" fill="#7f1d1d">Bob — WebID hosted by provider A</text>
  <rect x="34" y="98" width="150" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="116" font-size="10" font-family="monospace" fill="#334155">localhost:3000</text>
  <text x="44" y="131" font-size="10" font-family="monospace" fill="#334155">/bob/profile/card#me</text>
  <text x="196" y="118" font-size="20" fill="#ef4444">✕</text>
  <text x="222" y="123" font-size="11" fill="#7f1d1d">provider A is gone</text>
  <text x="34" y="164" font-size="12" font-weight="700" fill="#7f1d1d">Cannot authenticate anywhere.</text>
  <text x="34" y="184" font-size="11" fill="#7f1d1d">Identity did not merely lose its data —</text>
  <text x="34" y="198" font-size="11" fill="#7f1d1d">it ceased to exist with the provider.</text>

  <!-- Case B -->
  <rect x="395" y="66" width="345" height="140" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="409" y="88" font-size="12" font-weight="700" fill="#065f46">Alice — WebID on an independent origin</text>
  <rect x="409" y="98" width="150" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="419" y="116" font-size="10" font-family="monospace" fill="#334155">localhost:3002</text>
  <text x="419" y="131" font-size="10" font-family="monospace" fill="#334155">/alice.ttl#me</text>
  <line x1="565" y1="120" x2="620" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="628" y="124" font-size="11" fill="#065f46">provider B</text>
  <text x="409" y="164" font-size="12" font-weight="700" fill="#065f46">Still reads: 200 OK</text>
  <text x="409" y="184" font-size="11" fill="#065f46">Only pim:storage changed when she moved.</text>
  <text x="409" y="198" font-size="11" fill="#065f46">The identifier never belonged to a pod.</text>

  <!-- what moved -->
  <text x="16" y="240" font-size="13" font-weight="700" fill="#0f172a">What survived the migration itself</text>
  <rect x="20" y="252" width="230" height="86" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="34" y="272" font-size="11" font-weight="700" fill="#065f46">Moved intact</text>
  <text x="34" y="290" font-size="11" fill="#065f46">All documents and the binary</text>
  <text x="34" y="306" font-size="11" fill="#065f46">Media types, byte-identical SHA-256</text>
  <text x="34" y="322" font-size="11" fill="#065f46">Licence metadata</text>

  <rect x="262" y="252" width="230" height="86" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="276" y="272" font-size="11" font-weight="700" fill="#7c2d12">Moved, but stopped meaning</text>
  <text x="276" y="290" font-size="11" fill="#7c2d12">Internal links still name provider A</text>
  <text x="276" y="306" font-size="11" fill="#7c2d12">Rewriting works, but has no</text>
  <text x="276" y="322" font-size="11" fill="#7c2d12">protocol support at all</text>

  <rect x="504" y="252" width="236" height="86" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="518" y="272" font-size="11" font-weight="700" fill="#7f1d1d">Did not move</text>
  <text x="518" y="290" font-size="11" fill="#7f1d1d">ACLs — invisible to ldp:contains</text>
  <text x="518" y="306" font-size="11" fill="#7f1d1d">Identity — owl:sameAs ignored (403)</text>
  <text x="518" y="322" font-size="11" fill="#7f1d1d">No redirect possible at the old WebID</text>

  <text x="16" y="358" font-size="11" fill="#475569">Caveat: three localhost ports simulate three independent origins. They are not separate</text>
  <text x="16" y="372" font-size="11" fill="#475569">providers; DNS, TLS, CORS and organisational boundaries are out of scope.</text>
</svg>
